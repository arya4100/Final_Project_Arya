<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740"><rect width="1100" height="740" fill="#f6f8f2"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#7a9275"/></marker></defs><text x="35" y="43" font-size="27" fill="#234b37" font-family="Arial">SmartStock / Implementation class diagram</text><text x="35" y="72" font-size="14" fill="#49614e" font-family="Arial">MongoDB entities and client-side offline command record</text><rect x="40" y="115" width="270" height="190" rx="9" fill="white" stroke="#b9c9b5"/><path d="M40 158h270" stroke="#dce5d6"/><text x="55" y="142" font-size="18" fill="#234b37" font-family="Arial">User</text><text x="55" y="183" font-size="13" fill="#49614e" font-family="Arial">_id: ObjectId</text><text x="55" y="206" font-size="13" fill="#49614e" font-family="Arial">name, email: string</text><text x="55" y="229" font-size="13" fill="#49614e" font-family="Arial">passwordHash: string</text><text x="55" y="252" font-size="13" fill="#49614e" font-family="Arial">role: manager | employee</text><rect x="405" y="115" width="280" height="240" rx="9" fill="white" stroke="#b9c9b5"/><path d="M405 158h280" stroke="#dce5d6"/><text x="420" y="142" font-size="18" fill="#234b37" font-family="Arial">Product</text><text x="420" y="183" font-size="13" fill="#49614e" font-family="Arial">_id: ObjectId; sku: unique</text><text x="420" y="206" font-size="13" fill="#49614e" font-family="Arial">name, category: string</text><text x="420" y="229" font-size="13" fill="#49614e" font-family="Arial">price: number</text><text x="420" y="252" font-size="13" fill="#49614e" font-family="Arial">quantity, minimum: integer</text><text x="420" y="275" font-size="13" fill="#49614e" font-family="Arial">version: integer</text><text x="420" y="298" font-size="13" fill="#49614e" font-family="Arial">updatedAt: Date</text><rect x="790" y="115" width="270" height="240" rx="9" fill="white" stroke="#b9c9b5"/><path d="M790 158h270" stroke="#dce5d6"/><text x="805" y="142" font-size="18" fill="#234b37" font-family="Arial">StockMovement</text><text x="805" y="183" font-size="13" fill="#49614e" font-family="Arial">_id: ObjectId</text><text x="805" y="206" font-size="13" fill="#49614e" font-family="Arial">productId, actorId: string</text><text x="805" y="229" font-size="13" fill="#49614e" font-family="Arial">type: IN | OUT; quantity: int</text><text x="805" y="252" font-size="13" fill="#49614e" font-family="Arial">clientId: UUID (unique)</text><text x="805" y="275" font-size="13" fill="#49614e" font-family="Arial">actor, note: string</text><text x="805" y="298" font-size="13" fill="#49614e" font-family="Arial">createdAt, updatedAt: Date</text><rect x="40" y="450" width="270" height="190" rx="9" fill="white" stroke="#b9c9b5"/><path d="M40 493h270" stroke="#dce5d6"/><text x="55" y="477" font-size="18" fill="#234b37" font-family="Arial">PushSubscription</text><text x="55" y="518" font-size="13" fill="#49614e" font-family="Arial">userId: string</text><text x="55" y="541" font-size="13" fill="#49614e" font-family="Arial">endpoint: HTTPS URL</text><text x="55" y="564" font-size="13" fill="#49614e" font-family="Arial">subscription: {endpoint, keys}</text><text x="55" y="587" font-size="13" fill="#49614e" font-family="Arial">unique: userId + endpoint</text><rect x="405" y="450" width="280" height="210" rx="9" fill="white" stroke="#b9c9b5"/><path d="M405 493h280" stroke="#dce5d6"/><text x="420" y="477" font-size="18" fill="#234b37" font-family="Arial">AuditEntry</text><text x="420" y="518" font-size="13" fill="#49614e" font-family="Arial">action: create | update | delete</text><text x="420" y="541" font-size="13" fill="#49614e" font-family="Arial">recordId, actorId</text><text x="420" y="564" font-size="13" fill="#49614e" font-family="Arial">before: movement | null</text><text x="420" y="587" font-size="13" fill="#49614e" font-family="Arial">after: movement | null</text><text x="420" y="610" font-size="13" fill="#49614e" font-family="Arial">at: Date</text><rect x="790" y="450" width="270" height="210" rx="9" fill="white" stroke="#b9c9b5"/><path d="M790 493h270" stroke="#dce5d6"/><text x="805" y="477" font-size="18" fill="#234b37" font-family="Arial">OfflineQueueItem (IndexedDB)</text><text x="805" y="518" font-size="13" fill="#49614e" font-family="Arial">clientId: UUID</text><text x="805" y="541" font-size="13" fill="#49614e" font-family="Arial">user: user ID</text><text x="805" y="564" font-size="13" fill="#49614e" font-family="Arial">movement: command payload</text><text x="805" y="587" font-size="13" fill="#49614e" font-family="Arial">state: pending | conflict</text><text x="805" y="610" font-size="13" fill="#49614e" font-family="Arial">error: optional string</text><path d="M310 170L790 170" stroke="#7a9275" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="555" y="162" font-size="11" fill="#49614e" font-family="Arial">1 records *</text><path d="M685 275L790 275" stroke="#7a9275" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="742.5" y="267" font-size="11" fill="#49614e" font-family="Arial">1 : *</text><path d="M175 305L175 450" stroke="#7a9275" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="180" y="369.5" font-size="11" fill="#49614e" font-family="Arial">1 subscribes *</text><path d="M870 355L630 450" stroke="#7a9275" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="755" y="394.5" font-size="11" fill="#49614e" font-family="Arial">audits changes</text><path d="M925 450L925 355" stroke="#7a9275" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="930" y="394.5" font-size="11" fill="#49614e" font-family="Arial">replays once</text><text x="35" y="710" font-size="13" fill="#49614e" font-family="Arial">Transactions commit product + movement + audit together. Product deletion protects active movement history.</text></svg>