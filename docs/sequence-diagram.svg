<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740"><rect width="1100" height="740" fill="#f6f8f2"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#7a9275"/></marker></defs><text x="35" y="43" font-size="27" fill="#234b37" font-family="Arial">SmartStock / Stock-out sequence</text><text x="35" y="72" font-size="14" fill="#49614e" font-family="Arial">Authentication, offline replay, transactional validation and low-stock messaging</text><rect x="45" y="100" width="170" height="55" rx="9" fill="white" stroke="#b9c9b5"/><path d="M45 143h170" stroke="#dce5d6"/><text x="60" y="127" font-size="18" fill="#234b37" font-family="Arial">React PWA</text><path d="M130 155V680" stroke="#c6d3bf" stroke-dasharray="5 5"/><rect x="315" y="100" width="170" height="55" rx="9" fill="white" stroke="#b9c9b5"/><path d="M315 143h170" stroke="#dce5d6"/><text x="330" y="127" font-size="18" fill="#234b37" font-family="Arial">IndexedDB</text><path d="M400 155V680" stroke="#c6d3bf" stroke-dasharray="5 5"/><rect x="595" y="100" width="170" height="55" rx="9" fill="white" stroke="#b9c9b5"/><path d="M595 143h170" stroke="#dce5d6"/><text x="610" y="127" font-size="18" fill="#234b37" font-family="Arial">Express API</text><path d="M680 155V680" stroke="#c6d3bf" stroke-dasharray="5 5"/><rect x="870" y="100" width="170" height="55" rx="9" fill="white" stroke="#b9c9b5"/><path d="M870 143h170" stroke="#dce5d6"/><text x="885" y="127" font-size="18" fill="#234b37" font-family="Arial">MongoDB</text><path d="M955 155V680" stroke="#c6d3bf" stroke-dasharray="5 5"/><path d="M130 195L400 195" stroke="#7a9275" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="270" y="187" font-size="11" fill="#49614e" font-family="Arial">Offline: queue UUID command</text><path d="M400 245L130 245" stroke="#7a9275" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="270" y="237" font-size="11" fill="#49614e" font-family="Arial">Pending; stock unchanged</text><path d="M130 295L680 295" stroke="#7a9275" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="410" y="287" font-size="11" fill="#49614e" font-family="Arial">Online/reconnect: POST /movements + JWT</text><text x="545" y="327" font-size="13" fill="#49614e" font-family="Arial">Validate role, fields and clientId</text><path d="M680 360L955 360" stroke="#7a9275" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="822.5" y="352" font-size="11" fill="#49614e" font-family="Arial">Transaction: read product + duplicate</text><path d="M955 410L680 410" stroke="#7a9275" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="822.5" y="402" font-size="11" fill="#49614e" font-family="Arial">Existing replay OR current stock</text><text x="540" y="445" font-size="13" fill="#49614e" font-family="Arial">reconcile(current, previous, next)</text><path d="M680 485L130 485" stroke="#7a9275" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="410" y="477" font-size="11" fill="#49614e" font-family="Arial">409 conflict if insufficient; keep queue item</text><path d="M680 535L955 535" stroke="#7a9275" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="822.5" y="527" font-size="11" fill="#49614e" font-family="Arial">Valid: quantity + movement + audit; commit</text><path d="M955 580L680 580" stroke="#7a9275" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="822.5" y="572" font-size="11" fill="#49614e" font-family="Arial">Commit confirmed</text><path d="M680 625L130 625" stroke="#7a9275" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="410" y="617" font-size="11" fill="#49614e" font-family="Arial">201 movement; clear queue; refresh snapshot</text><text x="35" y="710" font-size="13" fill="#49614e" font-family="Arial">After commit: threshold crossing triggers best-effort encrypted Web 